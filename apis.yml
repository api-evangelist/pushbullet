- aid: pushbullet:realtime-event-stream
  name: Pushbullet Realtime Event Stream
  description: >-
    Secure WebSocket stream that delivers realtime events to a Pushbullet account, including periodic
    `nop` keep-alives, `tickle` notifications that signal changes to pushes or devices, and `push` ephemerals
    for mirrored notifications, dismissals, and universal clipboard.
  humanURL: https://docs.pushbullet.com/#realtime-event-stream
  baseURL: wss://stream.pushbullet.com/websocket
