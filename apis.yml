apis:
- aid: pushbullet:http-api
  name: Pushbullet HTTP API
  description: >-
    REST API for sending and managing pushes, devices, chats, channels, subscriptions, and file uploads
    across the Pushbullet ecosystem. Authentication uses an access token from account settings supplied
    via the `Access-Token` header; OAuth 2.0 is available for third-party apps.
  humanURL: https://docs.pushbullet.com
  baseURL: https://api.pushbullet.com/v2
